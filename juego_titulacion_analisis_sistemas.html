const MODULES=['MÓDULO 01: ESTUDIOS DE FACTIBILIDAD','MÓDULO 02: INFORMACIÓN Y NECESIDADES DEL SISTEMA','MÓDULO 03: DISEÑO DE SISTEMAS','MÓDULO 04: PRUEBA E IMPLEMENTACIÓN DE SISTEMAS'];
QUESTIONS.forEach((x,i)=>{ if(!x.module) x.module=MODULES[Math.floor(i/35)]||'MÓDULO'; });
let deck=[],pos=0,score=0,lives=3,streak=0,correct=0,answered=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startGame(){
 deck=[...QUESTIONS];pos=0;score=0;lives=3;streak=0;correct=0;
 document.getElementById('start').style.display='none';document.getElementById('result').style.display='none';document.getElementById('game').style.display='block';show();
}
function show(){
 answered=false;let x=deck[pos];
 document.getElementById('module').textContent=(x.module||'Módulo '+((pos%4)+1)).replace('MÓDULO ','MÓD. ');
 document.getElementById('lives').textContent='❤️'.repeat(lives);
 document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;
 document.getElementById('counter').textContent=`Pregunta ${pos+1} de ${deck.length} · Dificultad: ${x.diff}`;
 document.getElementById('bar').style.width=((pos)/deck.length*100)+'%';
 document.getElementById('question').textContent=x.q;
 let box=document.getElementById('options');box.innerHTML='';
 x.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${'ABCDE'[i]})</b> ${o}`;b.onclick=()=>answer(i,b);box.appendChild(b)});
 document.getElementById('feedback').textContent='Elige una alternativa.';
 document.getElementById('next').style.display='none';
}
function answer(i,btn){
 if(answered)return;answered=true;let x=deck[pos], buttons=document.querySelectorAll('.opt');
 buttons.forEach(b=>b.disabled=true);buttons[x.ans].classList.add('correct');
 if(i===x.ans){score+=10;correct++;streak++;document.getElementById('feedback').textContent=`✅ ¡Correcto! +10 puntos. 🔥 Racha x${streak}`;}
 else{btn.classList.add('wrong');lives--;streak=0;document.getElementById('feedback').textContent=`❌ Incorrecto. La respuesta correcta es ${'ABCDE'[x.ans]}) ${x.opts[x.ans]}.`;}
 document.getElementById('lives').textContent='❤️'.repeat(lives)||'💀';document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;
 document.getElementById('next').style.display='block';
}
function nextQuestion(){
 pos++;
 if(lives<=0 || pos>=deck.length){finish();return}
 show();
}
function finish(){
 document.getElementById('game').style.display='none';document.getElementById('result').style.display='block';
 let pct=Math.round(correct/deck.length*100);
 document.getElementById('finalScore').textContent=score+' puntos';
 document.getElementById('message').textContent=pct>=80?'🔥 ¡Excelente!':pct>=60?'💪 ¡Vas bien!':'📚 ¡A seguir practicando!';
 document.getElementById('stats').textContent=`Aciertos: ${correct} de ${Math.min(pos,deck.length)} · Porcentaje: ${pct}%`;
}
